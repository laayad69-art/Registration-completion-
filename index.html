<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مجمع مدارس علاء زكي زكي — التسجيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0b1220; --bg2:#111c33; --bg3:#0a1a2f;
    --card:rgba(255,255,255,.045);
    --stroke:rgba(255,255,255,.10);
    --accent:#38ef7d; --accent2:#11998e;
    --text:#e9f1ff; --muted:#9fb2cc;
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;padding:40px 16px;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(56,239,125,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(17,153,142,.12), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    color:var(--text);
    display:flex;align-items:flex-start;justify-content:center;
  }
  .container{
    width:100%;max-width:700px;
    background:var(--card);
    border:1px solid var(--stroke);
    border-radius:22px;
    padding:34px 30px 28px;
    backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    position:relative;overflow:hidden;
  }
  .container::before{
    content:"";position:absolute;inset:-2px;border-radius:24px;padding:1px;
    background:linear-gradient(120deg,rgba(56,239,125,.35),rgba(17,153,142,.05),rgba(56,239,125,.25));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:6px}
  h1{font-size:21px;margin:0;font-weight:900;letter-spacing:.2px;text-align:center}
  h2{font-size:13px;font-weight:400;color:var(--muted);margin:6px 0 26px;text-align:center}
  .section{
    background:rgba(0,0,0,.22);
    border:1px solid var(--stroke);
    border-radius:14px;
    padding:16px 16px 8px;
    margin-bottom:16px;
  }
  .section-title{
    font-size:12px;font-weight:700;color:var(--accent);
    letter-spacing:.6px;margin:0 0 6px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  label{display:block;margin:12px 0 7px;font-size:13.5px;color:#cfe0f5;font-weight:600}
  input[type=text],input[type=password],select{
    width:100%;padding:13px 14px;border-radius:12px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.35);color:#fff;font-size:15px;
    outline:none;transition:border-color .18s, box-shadow .18s, background .18s;
    font-family:inherit;
  }
  input[type=text]:focus,input[type=password]:focus,select:focus{
    border-color:rgba(56,239,125,.65);
    box-shadow:0 0 0 3px rgba(56,239,125,.15);
    background:rgba(0,0,0,.5);
  }
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(0% + 18px) calc(50% - 2px),calc(0% + 23px) calc(50% - 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-left:40px}
  .hidden{display:none!important}
  .checks{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
  .check-row{
    display:flex;align-items:center;gap:12px;padding:12px 14px;
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:12px;cursor:pointer;transition:.18s;user-select:none;
  }
  .check-row:hover{border-color:rgba(56,239,125,.4);background:rgba(56,239,125,.05)}
  .check-row input{display:none}
  .box{
    width:22px;height:22px;border-radius:7px;flex:0 0 auto;
    border:2px solid rgba(255,255,255,.28);
    display:grid;place-items:center;transition:.18s;
    background:rgba(0,0,0,.25);
  }
  .box svg{width:13px;height:13px;stroke:#04210f;stroke-width:3;fill:none;opacity:0;transition:.15s}
  .check-row input:checked + .box{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 6px 16px rgba(56,239,125,.35)}
  .check-row input:checked + .box svg{opacity:1}
  .check-row input:checked ~ .course-name{color:#fff;font-weight:700}
  .course-name{font-size:14.5px;color:#d6e3f5}

  button.submit{
    width:100%;margin-top:26px;padding:17px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    color:#032013;font-size:17px;font-weight:900;letter-spacing:.4px;
    cursor:pointer;transition:transform .15s, box-shadow .15s;
    box-shadow:0 14px 30px rgba(56,239,125,.28), inset 0 1px 0 rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  button.submit::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    transform:translateX(-120%);transition:transform .6s;
  }
  button.submit:hover::after{transform:translateX(120%)}
  button.submit:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(56,239,125,.45)}
  button.submit:active{transform:translateY(0)}
  button.submit:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

  .msg{margin-top:16px;padding:13px 15px;border-radius:12px;text-align:center;font-size:14px;font-weight:600;display:none}
  .msg.show{display:block}
  .msg.ok{background:rgba(56,239,125,.14);border:1px solid rgba(56,239,125,.5);color:#b8ffd2}
  .msg.err{background:rgba(255,92,92,.14);border:1px solid rgba(255,92,92,.5);color:#ffc2c2}

  .footer-credit{
    margin-top:22px;padding-top:14px;
    border-top:1px solid rgba(255,255,255,.07);
    text-align:center;
    font-size:10.5px;
    color:var(--muted);
    opacity:.75;
  }
  .footer-credit .zmax{color:var(--accent);font-weight:700;letter-spacing:1px}

  @media (max-width:520px){
    body{padding:22px 10px}
    .container{padding:26px 18px 20px;border-radius:18px}
    h1{font-size:18px}
  }
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div>
      <h1>مجمع مدارس علاء زكي زكي</h1>
      <h2>الاعدادية والثانوية — تسجيل المستويات</h2>
    </div>
  </div>

  <form id="regForm" novalidate>

    <div class="section">
      <div class="section-title">المرحلة الدراسية</div>
      <select id="stage" required>
        <option value="">— اختر المرحلة —</option>
        <option value="grade1">الصف الأول الثانوي</option>
        <option value="grade2">الصف الثاني الثانوي (بكالوريا)</option>
      </select>
    </div>

    <div id="g1Box" class="section hidden">
      <div class="section-title">المستوى المتاح</div>
      <div class="checks">
        <label class="check-row">
          <input type="checkbox" class="g1course" value="JavaScript 42">
          <span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span class="course-name">JavaScript 42</span>
        </label>
      </div>
    </div>

    <div id="g2Box" class="section hidden">
      <div class="section-title">اختر مستوى أو أكثر</div>
      <div class="checks">
        <label class="check-row">
          <input type="checkbox" class="g2course" value="JavaScript 54">
          <span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span class="course-name">JavaScript 54</span>
        </label>
        <label class="check-row">
          <input type="checkbox" class="g2course" value="Python 25">
          <span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span class="course-name">Python 25</span>
        </label>
        <label class="check-row">
          <input type="checkbox" class="g2course" value="الثقافة المالية">
          <span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span class="course-name">الثقافة المالية</span>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">بيانات الطالب</div>
      <label for="fullname">الاسم الرباعي</label>
      <input type="text" id="fullname" required>

      <label for="username">اسم المستخدم في المنصة</label>
      <input type="text" id="username" required>

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" required>
    </div>

    <button type="submit" class="submit" id="submitBtn">
      <span id="submitText">إرسال التسجيل عبر واتساب</span>
    </button>
    <div id="result" class="msg"></div>
  </form>

  <div class="footer-credit">
    تم التصميم والتطوير — <span class="zmax">ZMAX</span>
  </div>
</div>

<script>
const WHATSAPP_NUMBER = "201275241517";

const stageSel = document.getElementById('stage');
const g1Box = document.getElementById('g1Box');
const g2Box = document.getElementById('g2Box');
const form = document.getElementById('regForm');
const result = document.getElementById('result');
const submitBtn = document.getElementById('submitBtn');
const submitText = document.getElementById('submitText');

stageSel.addEventListener('change', () => {
  g1Box.classList.toggle('hidden', stageSel.value !== 'grade1');
  g2Box.classList.toggle('hidden', stageSel.value !== 'grade2');
});

function showMsg(text, ok) {
  result.textContent = text;
  result.className = 'msg show ' + (ok ? 'ok' : 'err');
  if (ok) setTimeout(() => result.classList.remove('show'), 8000);
}

function validate() {
  if (!stageSel.value) return 'اختر المرحلة الدراسية';
  const fullname = document.getElementById('fullname').value.trim();
  if (fullname.split(/\s+/).length < 4) return 'الاسم لازم يكون رباعي (4 أسماء على الأقل)';
  if (document.getElementById('username').value.trim().length < 3) return 'اسم المستخدم قصير جدًا';
  if (document.getElementById('password').value.length < 4) return 'كلمة المرور قصيرة جدًا';

  if (stageSel.value === 'grade1') {
    if (!document.querySelector('.g1course:checked')) return 'اختر مستوى JavaScript 42';
  } else {
    const checked = [...document.querySelectorAll('.g2course:checked')];
    if (!checked.length) return 'اختر مستوى واحد على الأقل';
  }
  return null;
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const err = validate();
  if (err) return showMsg(err, false);

  submitBtn.disabled = true;
  submitText.textContent = 'جارٍ التحضير...';

  try {
    const stage = stageSel.value;
    const fullname = document.getElementById('fullname').value.trim();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const stageLabel = stage === 'grade1' ? 'الصف الأول الثانوي' : 'الصف الثاني الثانوي (بكالوريا)';

    let courses = [];
    if (stage === 'grade1') {
      courses = [document.querySelector('.g1course:checked').value];
    } else {
      courses = [...document.querySelectorAll('.g2course:checked')].map(c => c.value);
    }

    const message =
      `📥 تسجيل جديد\n` +
      `━━━━━━━━━━━━━━━\n` +
      `🏫 المرحلة: ${stageLabel}\n` +
      `📚 المستويات: ${courses.join(' , ')}\n` +
      `👤 الاسم الرباعي: ${fullname}\n` +
      `🔑 اسم المستخدم: ${username}\n` +
      `🔒 كلمة المرور: ${password}\n` +
      `🕒 الوقت: ${new Date().toISOString()}`;

    const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;

    window.open(waUrl, '_blank');

    showMsg('تم فتح واتساب — اضغط "إرسال" لإتمام التسجيل.', true);
    form.reset();
    g1Box.classList.add('hidden');
    g2Box.classList.add('hidden');
  } catch (ex) {
    showMsg('حدث خطأ: ' + ex.message, false);
  } finally {
    submitBtn.disabled = false;
    submitText.textContent = 'إرسال التسجيل عبر واتساب';
  }
});
</script>
</body>
</html>
